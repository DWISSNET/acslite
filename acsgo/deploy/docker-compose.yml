  #     POSTGRES_DB: acsgo
  #     POSTGRES_USER: acsgo
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acsgo_password}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U acsgo"]
