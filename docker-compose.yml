version: '3.8'
services:
  mongodb:
    image: mongo:6-jammy
    container_name: acs-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: your_mongodb_password

  redis:
    image: redis:7-alpine
    container_name: acs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  acs-server:
    build: .
    container_name: advanced-acs-server
    restart: unless-stopped
    ports:
      - "7547:7547"   # TR-069/CWMP
      - "7548:7548"   # Web API/Dashboard
    depends_on:
      - mongodb
      - redis
    environment:
      - MONGODB_URI=mongodb://root:your_mongodb_password@mongodb:27017/advanced_acs?authSource=admin
      - REDIS_URI=redis://redis:6379
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs
      - ./firmware:/app/firmware

volumes:
  mongodb_data:
  redis_data: